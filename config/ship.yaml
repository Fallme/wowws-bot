# 战舰世界副炮流Bot - 船只配置
# 启动时选择加载哪个船

# === 波美拉尼亚 (Pommern) - 德系BB ===
pommern:
  name: "Pommern"
  display_name: "波美拉尼亚"
  type: "BB"
  nation: "german"
  has_torpedoes: true
  has_smoke: false

  main_gun:
    reload: 26          # 主炮装填秒数
    range: 24           # 主炮射程km
    shell_speed: 800    # 炮弹速度m/s (用于提前量)

  secondary:
    range: 11.4         # 副炮射程km (满配)
    reload: 3           # 副炮装填秒数

  torpedo:
    range: 6            # 鱼雷射程km
    reload: 90          # 鱼雷装填秒数

  navigation:
    speed: 30           # 最高航速节

  strategy:
    # 航向与敌距由小地图白色舰首箭头、红点及 5km 网格计算。
    preferred_side: 1                 # 1=right orbit, -1=left orbit
    opening_seconds: 55
    disengage_health: 0.28              # 兼容字段；站点逻辑不再因低血量主动掉头
    brake_start_distance_km: 13.0
    ideal_outer_distance_km: 11.2
    ideal_inner_distance_km: 7.0
    too_close_distance_km: 4.5
    distance_ocr_min_confidence: 0.78
    distance_stable_frames: 2
    distance_maximum_spread_km: 0.45
    distance_stale_seconds: 5.0
    distance_ocr_interval_seconds: 0.18
    # OCR 暂时不可用时按小地图每格 5 km 换算，不再使用经验比例猜距。
    secondary_enter_distance: 0.18   # 兼容旧事件回放
    ideal_outer_distance: 0.15       # 兼容旧事件回放
    ideal_inner_distance: 0.10       # 兼容旧事件回放
    too_close_distance: 0.07         # 兼容旧事件回放
    island_warning_distance: 0.120   # 战列舰舵效慢，约提前 8km 建立绕岛转向
    island_emergency_distance: 0.060 # 近岛立即硬舵，但仍保持向前脱离
    island_turn_commit_seconds: 3.8  # 单次绕岛转向上限；新帧必须重新确认
    rudder_minimum_hold_seconds: 4.0 # 普通航向修正避免左右指令反复抵消
    capture_throttle: 0.72           # 进入中央占领点后约 3/4 航速继续搜索
    enemy_steering_weight: 0.84      # 前方红点优先，中央点仅作弱防漂移约束
    center_steering_gain: 1.35       # 中央点航向控制增益
    straight_opening_seconds: 4.0    # 先建立短航迹，随后立即转向中央点
    stuck_seconds: 18.0              # 小地图位置完全不变时的兜底判定
    stuck_low_speed_seconds: 8.0     # 已给前进指令但持续低速则判定触岸
    stuck_low_speed_knots: 1.5       # 允许轻微漂移，避免0.4-0.6节永不触发
    autopilot_stall_speed_knots: 1.5 # 绿色自动航行存在但低于此速度也视为卡住
    stuck_escape_turn_seconds: 8.0   # 全速单侧硬舵脱离岸线，不倒船
    stuck_forward_seconds: 6.0       # 反舵扶正并继续向前驶离
    stuck_cooldown_seconds: 12.0     # 首次失败后允许换边再次脱困
    opening_autopilot_minimum_seconds: 35.0 # 开局至少保留游戏自动航行，避免出生点红色误报取消
    enable_minimap_torpedo_evasion: true   # 仅10km内确认驱逐/巡洋舰时允许覆盖
    manual_intervention_pause_seconds: 5.0
    manual_intervention_latch_seconds: 20.0
    secondary_target_distance_km: 10.0
    secondary_inner_distance_km: 7.0
    capture_zone_match_ratio: 0.08
    capture_arrival_distance_km: 4.5
    course_minimum_travel_pixels: 5.0
    post_battle_grace_seconds: 900
    damage_control_cooldown_seconds: 80
    heal_threshold: 0.50            # 兼容旧配置
    heal_loss_step: 0.20            # 兼容旧配置；当前受损后按30秒周期尝试其他消耗品
    heal_cooldown_seconds: 30       # 兼容旧字段
    other_consumable_cooldown_seconds: 30
    heal_max_uses: 3                # 兼容旧配置
    torpedo_fire_distance: 6000      # 鱼雷发射距离 (米)
    torpedo_avoid_distance: 3000     # 鱼雷规避距离 (米)
    main_gun_shoot_threshold: 0.8    # 准心偏移容差

